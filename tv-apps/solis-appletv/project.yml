name: Solis
options:
  bundleIdPrefix: nl.solisvoorhomey
  deploymentTarget:
    tvOS: "16.0"
targets:
  Solis:
    type: application
    platform: tvOS
    sources:
      - path: Solis
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.solisvoorhomey.solis
        INFOPLIST_FILE: Solis/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
